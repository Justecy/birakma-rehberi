<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b60"><meta name="description" content="Kişisel ve ücretsiz sigarayı bırakma rehberi.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Bırakma Rehberi</title>
<style>
:root{--bg:#f3f6f5;--surface:#fff;--ink:#203632;--muted:#71817d;--line:#e1e9e6;--accent:#247568;--accent-soft:#eaf4f1;--warn:#a66a12;--danger:#a83e35;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111c1a;--surface:#1b2926;--ink:#edf4f1;--muted:#a6b7b1;--line:#344540;--accent:#78c8b5;--accent-soft:#203a34;--warn:#edc16b;--danger:#f19a8e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 54px}header{margin-bottom:14px}h1{font-size:1.55rem;letter-spacing:-.03em;margin:0}h2{font-size:1.08rem;letter-spacing:-.01em;margin:0 0 10px}h3{font-size:.98rem;margin:0 0 6px}.muted{color:var(--muted);font-size:.9rem}.hero{background:linear-gradient(135deg,#246f63,#398b7b);color:white;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #174d4218}.hero .big{font-size:clamp(1.9rem,7vw,2.65rem);font-weight:800;line-height:1.15;letter-spacing:-.04em}.hero .small{opacity:.94;margin-top:7px}.urge{width:100%;margin-top:15px;padding:13px 15px;border:1px solid #ffffff55;border-radius:12px;background:#ffffff;color:#1c6257;font:inherit;font-weight:750;font-size:.96rem}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:16px 0 18px;padding:0}nav button{min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);padding:10px 7px;font:inherit;font-size:.88rem;font-weight:650}nav button[aria-selected=true]{background:var(--accent-soft);color:var(--accent);border-color:#9fc9bd;box-shadow:inset 0 0 0 1px #9fc9bd}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px 18px;margin-bottom:13px;box-shadow:0 2px 8px #1d423508}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:11px;background:var(--accent);color:white;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:white}.btn.small{padding:8px 11px;font-size:.86rem}input,select,textarea{width:100%;max-width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}input[type=number]{width:100%}input[type=checkbox]{width:21px;height:21px}.field{display:block;font-size:.9rem;color:var(--ink);font-weight:650;margin:14px 0 6px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.check input{width:21px;height:21px;flex:none;margin:2px 0 0;accent-color:var(--accent)}.check input:checked+span{text-decoration:line-through;color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:var(--bg);color:var(--ink);font:inherit}.chip[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats .card{text-align:center;margin:0;padding:13px 10px;box-shadow:none}.stats b{display:block;font-size:1.4rem}.bar{height:10px;border-radius:20px;background:var(--bg);overflow:hidden;border:1px solid var(--line);margin:10px 0}.bar i{display:block;height:100%;background:var(--accent);width:0;border-radius:20px}.day{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px}.day.today{border:2px solid var(--warn)}.day.complete{border-color:var(--accent)}.dayhead{display:flex;justify-content:space-between;gap:8px}.tag{font-size:.82rem;color:var(--muted)}.logitem{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.logitem:last-child{border:0}.bars{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem}.bars .name{width:105px;flex:none}.bars .track{height:10px;flex:1;background:var(--bg);border-radius:20px;overflow:hidden}.bars .track i{display:block;height:100%;background:var(--accent)}.notice{background:var(--accent-soft);padding:12px 14px;border-radius:11px;margin:12px 0}.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:var(--bg)}.cell.done{background:var(--accent);border-color:var(--accent)}.cell.now{outline:2px solid var(--warn);outline-offset:1px}.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay.on{display:flex}.modal{width:min(420px,100%)}.timer{font-size:3rem;font-weight:800}.orb{width:130px;height:130px;background:var(--accent);border-radius:50%;margin:22px auto;animation:breathe 10s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.65)}45%{transform:scale(1)}}.hidden{display:none!important}.foot{font-size:.82rem;color:var(--muted);text-align:center;margin-top:22px}.setup-intro{font-size:.94rem;color:var(--muted);margin:0 0 16px}.setup-section{padding-top:13px;margin-top:15px;border-top:1px solid var(--line)}.setup-section:first-of-type{border-top:0;margin-top:0;padding-top:0}.setup-kicker{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:5px}details.optional{border-top:1px solid var(--line);margin-top:16px;padding-top:13px}details.optional summary{font-weight:700;color:var(--accent);cursor:pointer}.date-help{font-size:.82rem;color:var(--muted);margin:6px 0 0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}@media(max-width:520px){main{padding:16px 12px 42px}.fieldgrid{grid-template-columns:1fr}.hero{padding:18px}.card{padding:15px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}nav button{padding:10px 8px}.grid30{gap:3px}}
</style>
</head>
<body><main>
<header class="row between"><h1>Bırakma Rehberi</h1><button class="btn secondary small" id="settingsTop">Ayarlar</button></header>
<section class="hero" aria-live="polite"><div class="big" id="counter">Hoş geldin</div><div class="small" id="subcounter">Kendi bırakma planını oluştur.</div><button class="urge" id="urgeBtn">Canım çekti — 5 dakikayı birlikte geçirelim</button></section>
<nav id="tabs" role="tablist"></nav><section id="view"></section>
<p class="foot">Kayıtların bu cihazdaki tarayıcıda saklanır. Verilerini Ayarlar bölümünden yedekleyebilirsin. Bu rehber tıbbi tedavi yerine geçmez.</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Dürtü desteği"><div class="modal"><h2 id="oTitle">Dürtü dalga gibi gelir ve geçer.</h2><div class="timer" id="oTime">5:00</div><div class="orb" aria-hidden="true"></div><b id="oBreath">Yavaşça nefes al</b><p class="muted" id="oTip">Bir bardak su iç.</p><div class="row" style="justify-content:center"><button class="btn hidden" id="oDone">Atlattım, +1</button><button class="btn secondary" id="oClose">Kapat</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='birakma_rehberi_v3';const $=id=>document.getElementById(id);const DAY=86400000;
const defaults={setup:false,name:'',programStart:'',quitDate:'',cigsPerDay:10,baselineCigs:10,packPrice:0,packSize:20,usesTerea:false,usesVape:false,yearsSmoking:0,firstCigTime:'31-60 dk',checks:{},logs:[],urges:0,reasons:'',dailyNotes:{},moodLogs:[],urgeLogs:[],quitStartedAt:'',milestonesAchieved:[]};
let S={...defaults};try{const currentData=localStorage.getItem(KEY),legacyData=localStorage.getItem('birakma_rehberi_v2'),old=currentData||legacyData;if(old)S={...defaults,...JSON.parse(old)};if(!currentData&&legacyData){localStorage.setItem(KEY,JSON.stringify(S));localStorage.removeItem('birakma_rehberi_v2')}}catch(e){}
const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const parseDate=s=>{const [y,m,d]=(s||'').split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)};
const dateInput=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
if(S.setup&&!S.programStart){S.programStart=dateInput(new Date());S.baselineCigs=Number(S.cigsPerDay)||10;S.quitDate=dateInput(new Date(Date.now()+28*DAY));}
const fmt=n=>Math.round(n).toLocaleString('tr-TR');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Tarayıcı depolama alanı dolu olabilir. Lütfen yedek alıp eski kayıtları kontrol et.')}}
function dateTR(d){return new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',weekday:'long'}).format(d)}
function daysSinceQuit(){return Math.floor((Date.now()-parseDate(S.quitDate).getTime())/DAY)}
const MILESTONES=[[1,'İlk 24 saat'],[2,'48 saat'],[3,'72 saat'],[7,'İlk hafta'],[14,'2 hafta'],[30,'30 gün'],[90,'90 gün'],[365,'1 yıl']];
function abstinenceStart(){if(!S.quitStartedAt)return null;const started=new Date(S.quitStartedAt).getTime();const last=S.logs.filter(l=>l.type!=='vape'&&new Date(l.time).getTime()>=started).reduce((a,l)=>Math.max(a,new Date(l.time).getTime()),started);return last}
function updateMilestones(until=Date.now()){const start=abstinenceStart();if(start===null)return;const elapsed=Math.max(0,until-start);S.milestonesAchieved=Array.isArray(S.milestonesAchieved)?S.milestonesAchieved:[];let changed=false;MILESTONES.forEach(([d])=>{if(elapsed>=d*DAY&&!S.milestonesAchieved.includes(d)){S.milestonesAchieved.push(d);changed=true}});if(changed)save();} 
function recordMilestonesBeforeUse(){const start=abstinenceStart();if(start!==null)updateMilestones(Date.now());}
function programDay(d){const start=parseDate(S.programStart||dateInput(new Date()));return Math.round((new Date(d).setHours(0,0,0,0)-start.getTime())/DAY)}
function phaseFor(d){const n=programDay(d),total=Math.max(14,Math.round((parseDate(S.quitDate).getTime()-parseDate(S.programStart||dateInput(new Date())).getTime())/DAY));if(n<0)return {name:'Başlangıç',ratio:null,detail:'Programa başlamadan önce hazırlık yap.'};if(n<=2)return {name:'Tanıma ve kayıt',ratio:null,detail:'İlk 3 gün tüketimini değiştirmeye çalışma; her kullanımı kaydet ve tetikleyicilerini tanı.'};if(n>=total)return {name:'Bırakma aşaması',ratio:0,detail:'Bugünkü hedef sıfır. Bir kullanım olursa kaydet ve plana geri dön.'};const span=Math.max(1,total-3),stage=Math.min(3,Math.floor((n-3)/(span/4))),ratios=[.8,.6,.4,.2],names=['1. hafta · İlk azaltma','2. hafta · Azaltmayı sürdür','3. hafta · Yeni rutin','4. hafta · Bırakmaya hazırlan'],details=['Başlangıç ortalamanın yaklaşık %80’ini aşmamayı hedefle.','Başlangıç ortalamanın yaklaşık %60’ını aşmamayı hedefle.','Başlangıç ortalamanın yaklaşık %40’ını aşmamayı hedefle.','Başlangıç ortalamanın yaklaşık %20’sini aşmamayı hedefle.'];return {name:names[stage],ratio:ratios[stage],detail:details[stage]}}
function targetFor(d){const phase=phaseFor(d);if(phase.ratio===null)return null;if(phase.ratio===0)return 0;return Math.max(1,Math.ceil((Number(S.baselineCigs)||Number(S.cigsPerDay)||1)*phase.ratio))}
function usedOn(d){const k=dayKey(d);return S.logs.filter(l=>l.type!=='vape'&&dayKey(new Date(l.time))===k).length}
function tasksFor(d){const n=programDay(d),phase=phaseFor(d);if(n<0)return ['Başlangıç gününü ve bırakma nedenlerini belirle','Sigara içtiğin anları fark etmeye hazırlan'];if(phase.ratio===null)return ['Her sigara / Terea kullanımını saat ve tetikleyiciyle kaydet','İlk sigaranın hangi durumda geldiğini fark et','Kendini yargılamadan günlük ortalamanı gözlemle'];if(phase.ratio>=.8)return ['Günlük hedefini aşmamaya çalış','Otomatik içtiğin bir sigarayı 10 dakika ertele','Bir tetikleyici için sigarasız alternatif belirle'];if(phase.ratio>=.6)return ['Günlük hedefini aşmamaya çalış','İlk sigaranı normalden 15 dakika geciktir','Bir rutinini sigarasız tamamla'];if(phase.ratio>=.4)return ['Günlük hedefini aşmamaya çalış','En güçlü tetikleyicine önceden alternatif hazırla','Sigara içilmeyen bir ortam / zaman aralığı oluştur'];if(phase.ratio>.0)return ['Günlük hedefini aşmamaya çalış','Bırakma gününde destek alacağın kişiyi belirle','Sigara, çakmak ve kül tablalarını ortamından kaldırma planı yap'];return ['Bugün tütün ürünü kullanmamayı hedefle','Dürtü geldiğinde 5 dakikalık destek aracını kullan','Zorlanırsan bir sağlık profesyonelinden destek al'];}
function complete(d){const k=dayKey(d);return tasksFor(d).every((_,i)=>S.checks[k+'#'+i])}
function setTab(index){current=index;drawTabs();draw()};let current=0;const tabs=['Bugün','Koçum','Tetikleyici','Ruh hali','İlerleme','Planım','Ayarlar'];
function drawTabs(){const n=$('tabs');n.innerHTML='';tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===current));b.onclick=()=>setTab(i);n.append(b)})}
function card(title,body=''){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function setupView(){
 const today=dateInput(new Date()),suggested=dateInput(new Date(Date.now()+28*DAY)),startValue=S.programStart||today,quitValue=S.quitDate||suggested;
 return `<section class="card"><div class="setup-kicker">Kişisel başlangıç</div><h2>Önce seni ve hedefini tanıyalım</h2><p class="setup-intro">Birkaç kısa bilgiyle sana uygun bir yol haritası oluşturalım. Programın tarihi ve günlük hedefleri senin seçimlerine göre belirlenecek.</p>
 <form id="setupForm">
 <div class="setup-section"><label class="field" for="setupName">Adın <span class="muted">(isteğe bağlı)</span></label><input id="setupName" name="name" maxlength="30" placeholder="Nasıl hitap edelim?" value="${esc(S.name)}"></div>
 <div class="setup-section"><div class="setup-kicker">Tarihlerini belirle</div><div class="fieldgrid"><div><label class="field" for="programStart">Programa başlamak istediğin tarih</label><input id="programStart" name="programStart" type="date" min="${today}" required value="${esc(startValue)}"></div><div><label class="field" for="quitDate">Tamamen bırakmayı hedeflediğin tarih</label><input id="quitDate" name="quitDate" type="date" required value="${esc(quitValue)}"></div></div><p class="date-help" id="dateHelp">Önerilen süre 28 gün. Başlangıçtan sonra en az 14 gün bırakmanı öneriyoruz; istersen daha uzun bir plan seçebilirsin.</p></div>
 <div class="setup-section"><div class="setup-kicker">Kullanım alışkanlığın</div><label class="field" for="cigsPerDay">Günde ortalama kaç sigara / Terea kullanıyorsun?</label><input id="cigsPerDay" name="cigsPerDay" type="number" min="1" max="200" required value="${Math.max(1,S.cigsPerDay)}"><div class="fieldgrid"><div><label class="field" for="yearsSmoking">Kaç yıldır tütün kullanıyorsun?</label><input id="yearsSmoking" name="yearsSmoking" type="number" min="0" max="80" value="${S.yearsSmoking||0}"></div><div><label class="field" for="firstCigTime">Uyandıktan ne kadar sonra ilk sigara?</label><select id="firstCigTime" name="firstCigTime">${['İlk 5 dakika','6-30 dk','31-60 dk','60 dakikadan sonra'].map(x=>`<option ${S.firstCigTime===x?'selected':''}>${x}</option>`).join('')}</select></div></div><p class="date-help">Bu sorular tanı koymaz; yalnızca başlangıç profilini oluşturmaya yardımcı olur.</p></div>
 <details class="optional"><summary>Ek bilgiler (isteğe bağlı)</summary><div class="fieldgrid"><div><label class="field" for="packPrice">Paket fiyatı (₺)</label><input id="packPrice" name="packPrice" type="number" min="0" step="0.01" value="${S.packPrice}"></div><div><label class="field" for="packSize">Pakette kaç adet var?</label><input id="packSize" name="packSize" type="number" min="1" max="100" value="${S.packSize}"></div><div><label class="field" for="usesTerea">Terea / ısıtılmış tütün kullanıyor musun?</label><select id="usesTerea" name="usesTerea"><option value="false" ${!S.usesTerea?'selected':''}>Hayır</option><option value="true" ${S.usesTerea?'selected':''}>Evet</option></select></div><div><label class="field" for="usesVape">Elektronik sigara kullanıyor musun?</label><select id="usesVape" name="usesVape"><option value="false" ${!S.usesVape?'selected':''}>Hayır</option><option value="true" ${S.usesVape?'selected':''}>Evet</option></select></div></div></details>
 <div class="notice"><b>Program nasıl işleyecek?</b><br>İlk 3 gün kullanımını gözlemleyeceğiz. Sonrasında seçtiğin bırakma tarihine kadar tüketimini aşamalı azaltmaya yönelik hedefler oluşturacağız. Bu yüzdeler uygulamanın davranışsal hedefleridir; herkes için geçerli tıbbi bir protokol değildir.</div><p class="muted">Nikotin bandı, sakızı veya ilaç desteği gibi seçenekleri doktor ya da eczacıyla değerlendirebilirsin. Bu uygulama tıbbi tedavi yerine geçmez.</p><button class="btn" type="submit">Planımı oluştur</button>
 </form></section>`
}
function todayView(){const now=new Date(),k=dayKey(now),tasks=tasksFor(now),phase=phaseFor(now),target=targetFor(now),used=usedOn(now);let html=card('Programın · '+phase.name,`<p>${phase.detail}</p>${target===null?'<p class="muted">Bugün sayı azaltma baskısı yok. Her kullanımı kaydetmen yeterli.</p>':`<div class="row between"><b>Bugünkü üst sınır: ${target} adet</b><span class="tag">Kaydedilen: ${used}</span></div><div class="bar"><i style="width:${target===0?(used?100:0):Math.min(100,used/target*100)}%"></i></div><p class="muted">Bu bir hedef; aşarsan kendini suçlama. Kaydı dürüstçe tut ve plana devam et.</p>`}`);html+=card(`Bugünün hedefleri · ${dateTR(now)}`,tasks.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${k}#${i}" ${S.checks[k+'#'+i]?'checked':''}><span>${t}</span></label>`).join('')+`<div class="bar"><i style="width:${Math.round(tasks.filter((_,i)=>S.checks[k+'#'+i]).length/tasks.length*100)}%"></i></div><p class="muted">${tasks.filter((_,i)=>S.checks[k+'#'+i]).length}/${tasks.length} hedef tamamlandı</p>`);
 html+=`<section class="card"><h2>Kullandım, kaydet</h2><p class="muted">Kendini yargılamak için değil, alışkanlığını tanımak için kayıt tut.</p><div class="chips" id="typeChips"><button class="chip" data-type="sigara" aria-pressed="true">Sigara</button><button class="chip" data-type="terea" aria-pressed="false">Terea / ısıtılmış tütün</button><button class="chip" data-type="vape" aria-pressed="false">Vape</button></div><label class="field">Tetikleyici</label><select id="trigger"><option>Kahve</option><option>Uyanınca</option><option>Stres</option><option>Sıkıntı</option><option>Yemek sonrası</option><option>İş molası</option><option>Telefon / alışkanlık</option><option>Sosyal ortam</option><option>Alkol</option><option>Yalnızlık</option><option>Ödül / kendimi iyi hissetme</option><option>Diğer</option></select><label class="field">Saat</label><input id="logTime" type="time" value="${new Date().toTimeString().slice(0,5)}"><p><button class="btn" id="saveLog">Kaydı ekle</button></p><p class="muted" id="todayCount"></p></section>`;
 html+=card('Bugün kendine not bırak',`<textarea id="todayNote" placeholder="Bugün nasıl gidiyor? Seni ne zorladı?">${esc(S.dailyNotes[k]||'')}</textarea><button class="btn secondary" id="saveNote">Notu kaydet</button>`);return html}
function coachView(){
 const now=new Date(),recent=S.logs.filter(l=>Date.now()-new Date(l.time).getTime()<=7*DAY&&l.type!=='vape'),by={};recent.forEach(l=>by[l.trigger]=(by[l.trigger]||0)+1);
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];const phase=phaseFor(now),target=targetFor(now),used=usedOn(now);
 let insight='Henüz yeterli kullanım kaydın yok. Birkaç gün boyunca saat ve tetikleyicileri kaydet; öneriler zamanla sana özel hale gelecek.';

function triggersView(){if(!S.logs.length)return card('Tetikleyici haritan','<p class="muted">Henüz kayıt yok. Bugün sekmesinden kullanım kaydı ekledikçe burada örüntülerini görebilirsin.</p>');const by={},hours={};S.logs.forEach(l=>{by[l.trigger]=(by[l.trigger]||0)+1;const h=new Date(l.time).getHours(),slot=Math.floor(h/3)*3;hours[slot]=(hours[slot]||0)+1});const max=Math.max(...Object.values(by));let html=card('Seni en çok ne tetikliyor?',Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="bars"><span class="name">${esc(n)}</span><span class="track"><i style="width:${v/max*100}%"></i></span><b>${v}</b></div>`).join(''));

 const ms=MILESTONES.map(([d,t])=>{const earned=(S.milestonesAchieved||[]).includes(d),current=quitDays>=d;let status=current?'✅ Bu aşamaya ulaştın':earned?'🏅 Daha önce tamamlandı':'⏳ Henüz ulaşılmadı';return `<p>${status} · ${d} gün — ${t}</p>`}).join('');
 html+=card('Kilometre taşların',ms);
 html+=card('Neden bırakıyorum?',`<textarea id="reasons" placeholder="Zorlandığında hatırlamak istediğin 3 nedeni yaz.">${esc(S.reasons)}</textarea><button class="btn secondary" id="saveReasons">Kaydet</button>`);
 const q=S.quitStartedAt?new Date(S.quitStartedAt):parseDate(S.quitDate);html+=card('30 günlük takip',`<div class="grid30">${Array.from({length:30},(_,i)=>{const d=new Date(q.getTime()+i*DAY);return `<div class="cell ${d<=new Date()&&complete(d)?'done':''} ${dayKey(d)===dayKey(new Date())?'now':''}" title="${dateTR(d)}"></div>`}).join('')}</div><p class="muted">Dolu kutu, o günün görevlerinin tamamlandığını gösterir.</p>`);return html}
function planView(){const start=parseDate(S.programStart||S.quitDate),today=new Date();today.setHours(0,0,0,0);const from=new Date(Math.min(start.getTime(),today.getTime()));const end=new Date(Math.max(parseDate(S.quitDate).getTime(),today.getTime())+14*DAY);let html='';let total=0,doneN=0;const stages=[['İlk 3 gün','Tüketimini değiştirmeden kaydet ve tetikleyicilerini tanı.'],['1. hafta','Başlangıç ortalamanın yaklaşık %80’i.'],['2. hafta','Başlangıç ortalamanın yaklaşık %60’ı.'],['3. hafta','Başlangıç ortalamanın yaklaşık %40’ı.'],['4. hafta','Başlangıç ortalamanın yaklaşık %20’si. Kalan ürünleri daha derin çekerek telafi etmeye çalışma.'],['Bırakma günü','Hedef sıfır. Tökezleme olursa kaydet ve destek al.']];html+=card('Kademeli azaltma basamakları',stages.map(([a,b])=>`<p><b>${a}</b><br><span class="muted">${b}</span></p>`).join(''));for(let d=new Date(from);d<=end;d.setDate(d.getDate()+1)){const x=new Date(d),k=dayKey(x),ts=tasksFor(x),n=ts.filter((_,i)=>S.checks[k+'#'+i]).length,target=targetFor(x),used=usedOn(x);total+=ts.length;doneN+=n;const targetLabel=target===null?'Gözlem':target===0?'0 hedef':`≤ ${target} adet`;html+=`<section class="day ${k===dayKey(today)?'today':''} ${n===ts.length?'complete':''}"><div class="dayhead"><h3>${dateTR(x)} ${k===S.quitDate?'· Bırakma günü':''}</h3><span class="tag">${targetLabel} · ${n}/${ts.length}</span></div>${ts.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${k}#${i}" ${S.checks[k+'#'+i]?'checked':''}><span>${t}</span></label>`).join('')}</section>`}return card('Genel görev ilerlemesi',`<b>${doneN}/${total} görev tamamlandı</b><div class="bar"><i style="width:${total?doneN/total*100:0}%"></i></div><p class="muted">Görevleri tamamlamak yardımcı olur; asıl ölçüt tüketimini dürüstçe takip etmek ve hedefe adım adım yaklaşmak.</p>`)+html}

function draw(){if(!S.setup){$('view').innerHTML=setupView();bindSetup();return}const views=[todayView,coachView,triggersView,moodView,progressView,planView,settingsView];$('view').innerHTML=views[current]();bindCommon();if(current===0)bindToday();if(current===3)bindMood();if(current===4)bindProgress();if(current===6)bindSettings();hero()}

function bindSetup(){const f=$('setupForm'),start=$('programStart'),quit=$('quitDate'),help=$('dateHelp');const syncDates=()=>{const base=parseDate(start.value||dateInput(new Date()));const min=dateInput(new Date(base.getTime()+14*DAY));quit.min=min;if(!quit.value||quit.value<min){quit.value=dateInput(new Date(base.getTime()+28*DAY));}help.textContent=`En erken hedef bırakma tarihi: ${new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric'}).format(parseDate(min))}. Önerilen süre 28 gün veya daha uzun.`};start.addEventListener('change',syncDates);syncDates();f.onsubmit=e=>{e.preventDefault();if(quit.value<dateInput(new Date(parseDate(start.value).getTime()+14*DAY)))return alert('Hedef bırakma tarihi, başlangıç tarihinden en az 14 gün sonra olmalı.');const fd=new FormData(f);applyForm(fd,true);S.setup=true;save();current=0;drawTabs();draw()}}

let selectedType='sigara';function bindToday(){document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))) });const count=S.logs.filter(l=>dayKey(new Date(l.time))===dayKey(new Date())&&l.type!=='vape').length;$('todayCount').textContent=`Bugün kaydettiğin sigara / Terea: ${count}`;$('saveLog').onclick=()=>{const t=$('logTime').value;if(!t)return alert('Lütfen saat seç.');const [h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d>Date.now())d.setDate(d.getDate()-1);if(selectedType!=='vape')recordMilestonesBeforeUse();S.logs.push({id:Date.now()+Math.random(),time:d.toISOString(),type:selectedType,trigger:$('trigger').value});save();draw()};$('saveNote').onclick=()=>{S.dailyNotes[dayKey(new Date())]=$('todayNote').value;save();alert('Notun kaydedildi.') }}
function bindProgress(){const startBtn=$('startQuitClock');if(startBtn)startBtn.onclick=()=>{if(!confirm('Son sigaranı içtin ve tamamen bırakmaya hazır mısın? Sayaç şimdi başlayacak. Daha sonra sigara/Terea kaydı eklersen sayaç o kullanım saatinden yeniden hesaplanır.'))return;S.quitStartedAt=new Date().toISOString();S.milestonesAchieved=[];save();draw()};$('saveReasons').onclick=()=>{S.reasons=$('reasons').value;save();alert('Kaydedildi.')}}
const tips=['Bir bardak su iç ve yavaşça içmeye odaklan.','Ayağa kalkıp birkaç dakika yürü.','Ellerini meşgul edecek bir şey bul.','Bulunduğun ortamı kısa süreliğine değiştir.','Dürtünün geçmesini bekle; kendine yüklenme.'];let interval=null,left=300;
function openUrge(){clearInterval(interval);left=300;$('overlay').classList.add('on');$('oDone').classList.add('hidden');$('oTitle').textContent='Dürtü dalga gibi gelir ve geçer.';const tick=()=>{$('oTime').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;$('oBreath').textContent=(300-left)%10<4?'Yavaşça nefes al':'Yavaşça nefes ver';$('oTip').textContent=tips[Math.floor((300-left)/35)%tips.length];if(left<=0){clearInterval(interval);$('oTitle').textContent='Bu anı atlattın. Kendinle gurur duy.';$('oDone').classList.remove('hidden')}else left--};tick();interval=setInterval(tick,1000)}
$('urgeBtn').onclick=openUrge;$('oClose').onclick=()=>{clearInterval(interval);$('overlay').classList.remove('on')};$('oDone').onclick=()=>{S.urges++;save();$('oClose').click();draw()};$('settingsTop').onclick=()=>{if(!S.setup){draw();return}setTab(6)};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(!S.setup){draw()}else{drawTabs();draw()}setInterval(hero,60000);
})();
</script></body></html>
