<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b60"><meta name="description" content="Kişisel ve ücretsiz sigarayı bırakma rehberi.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Bırakma Rehberi</title>
<style>
:root{--bg:#eef4f2;--surface:#fff;--ink:#173532;--muted:#647b77;--line:#d8e4e0;--accent:#176b60;--accent2:#e8f4f0;--warn:#a66a12;--danger:#a83e35;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101d1b;--surface:#1a2b28;--ink:#e8f1ee;--muted:#a2b7b1;--line:#314541;--accent:#68c4b1;--accent2:#203a34;--warn:#edc16b;--danger:#f19a8e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:18px 14px 50px}h1{font-size:1.45rem;margin:0 0 12px}h2{font-size:1.05rem;margin:0 0 9px}h3{font-size:.96rem;margin:0 0 6px}.muted{color:var(--muted);font-size:.9rem}.hero{background:var(--accent);color:white;border-radius:18px;padding:18px}.hero .big{font-size:clamp(2rem,8vw,2.7rem);font-weight:800;line-height:1.15}.hero .small{opacity:.92;margin-top:5px}.urge{width:100%;margin-top:13px;padding:14px;border:0;border-radius:12px;background:white;color:#176b60;font:inherit;font-weight:800;font-size:1rem}nav{display:flex;gap:6px;margin:14px 0;overflow:auto;padding-bottom:3px}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 12px;font:inherit;font-size:.9rem}nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:var(--accent2);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:white}.btn.small{padding:7px 10px;font-size:.88rem}input,select,textarea{max-width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}input[type=number]{width:120px}input[type=date]{width:100%}textarea{width:100%;min-height:90px}label.field{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}.check input{width:21px;height:21px;flex:none;margin:2px 0 0;accent-color:var(--accent)}.check input:checked+span{text-decoration:line-through;color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:var(--bg);color:var(--ink);font:inherit}.chip[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats .card{text-align:center;margin:0}.stats b{display:block;font-size:1.45rem}.bar{height:12px;border-radius:20px;background:var(--bg);overflow:hidden;border:1px solid var(--line);margin:8px 0}.bar i{display:block;height:100%;background:var(--accent);width:0}.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}.day.today{border:2px solid var(--warn)}.day.complete{border-color:var(--accent)}.dayhead{display:flex;justify-content:space-between;gap:8px}.tag{font-size:.82rem;color:var(--muted)}.logitem{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.logitem:last-child{border:0}.bars{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.9rem}.bars .name{width:105px;flex:none}.bars .track{height:10px;flex:1;background:var(--bg);border-radius:20px;overflow:hidden}.bars .track i{display:block;height:100%;background:var(--accent)}.notice{background:var(--accent2);padding:11px 13px;border-radius:10px;margin-bottom:12px}.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:var(--bg)}.cell.done{background:var(--accent);border-color:var(--accent)}.cell.now{outline:2px solid var(--warn);outline-offset:1px}.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay.on{display:flex}.modal{width:min(420px,100%)}.timer{font-size:3rem;font-weight:800}.orb{width:130px;height:130px;background:var(--accent);border-radius:50%;margin:22px auto;animation:breathe 10s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.65)}45%{transform:scale(1)}}.hidden{display:none!important}.foot{font-size:.82rem;color:var(--muted);text-align:center;margin-top:20px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}@media(max-width:420px){.fieldgrid{grid-template-columns:1fr}.hero .big{font-size:2rem}}
</style>
</head>
<body><main>
<header class="row between"><h1>Bırakma Rehberi</h1><button class="btn secondary small" id="settingsTop">Ayarlar</button></header>
<section class="hero" aria-live="polite"><div class="big" id="counter">Hoş geldin</div><div class="small" id="subcounter">Kendi bırakma planını oluştur.</div><button class="urge" id="urgeBtn">Canım çekti — 5 dakikayı birlikte geçirelim</button></section>
<nav id="tabs" role="tablist"></nav><section id="view"></section>
<p class="foot">Kayıtların bu cihazdaki tarayıcıda saklanır. Verilerini Ayarlar bölümünden yedekleyebilirsin.</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Dürtü desteği"><div class="modal"><h2 id="oTitle">Dürtü dalga gibi gelir ve geçer.</h2><div class="timer" id="oTime">5:00</div><div class="orb" aria-hidden="true"></div><b id="oBreath">Yavaşça nefes al</b><p class="muted" id="oTip">Bir bardak su iç.</p><div class="row" style="justify-content:center"><button class="btn hidden" id="oDone">Atlattım, +1</button><button class="btn secondary" id="oClose">Kapat</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='birakma_rehberi_v2';const $=id=>document.getElementById(id);const DAY=86400000;
const defaults={setup:false,name:'',quitDate:'',cigsPerDay:10,packPrice:0,packSize:20,usesVape:false,checks:{},logs:[],urges:0,reasons:'',dailyNotes:{}};
let S={...defaults};try{const old=localStorage.getItem(KEY);if(old)S={...defaults,...JSON.parse(old)}}catch(e){}
const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const parseDate=s=>{const [y,m,d]=(s||'').split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)};
const dateInput=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=n=>Math.round(n).toLocaleString('tr-TR');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Tarayıcı depolama alanı dolu olabilir. Lütfen yedek alıp eski kayıtları kontrol et.')}}
function dateTR(d){return new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',weekday:'long'}).format(d)}
function daysSinceQuit(){return Math.floor((Date.now()-parseDate(S.quitDate).getTime())/DAY)}
function tasksFor(d){const diff=Math.round((new Date(d).setHours(0,0,0,0)-parseDate(S.quitDate).getTime())/DAY);let tasks=[];
 if(diff<0)tasks=['Bugünkü sigara kullanımını dürüstçe kaydet','Bir tetikleyicini fark et ve not al','Bırakma gününde ihtiyaç duyacağın desteği planla'];
 else tasks=['Bugün sigara içmeden günü tamamla','Dürtü geldiğinde 3–5 dakika ertele','Yemeklerden sonra kısa bir yürüyüş yap','Bugün kendine iyi gelecek bir şey yap'];
 if(diff===0)tasks.unshift('Bırakma günün: sigara ve tütün ürünlerini erişiminden çıkar');
 if(diff===1)tasks.push('İlk 24 saati tamamlamak için kendini takdir et');if(diff===2)tasks.push('48 saatlik hedefe odaklan');if(diff===6)tasks.push('İlk haftanı değerlendir ve kendine küçük bir ödül seç');if(diff===29)tasks.push('30 günlük emeğini kutla');
 return tasks;
}
function complete(d){const k=dayKey(d);return tasksFor(d).every((_,i)=>S.checks[k+'#'+i])}
function setTab(index){current=index;drawTabs();draw()};let current=0;const tabs=['Bugün','Tetikleyiciler','İlerleme','Plan','Ayarlar'];
function drawTabs(){const n=$('tabs');n.innerHTML='';tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===current));b.onclick=()=>setTab(i);n.append(b)})}
function card(title,body=''){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function setupView(){return `<section class="card"><h2>Önce seni tanıyalım</h2><p class="muted">Bu bilgiler yalnızca bu tarayıcıda saklanır. İstediğin zaman Ayarlar'dan değiştirebilirsin.</p><form id="setupForm"><label class="field">Adın (isteğe bağlı)</label><input name="name" maxlength="30" placeholder="Nasıl hitap edelim?" value="${esc(S.name)}"><label class="field">Sigarayı bırakma tarihin</label><input name="quitDate" type="date" required value="${esc(S.quitDate||dateInput(new Date()))}"><div class="fieldgrid"><div><label class="field">Günde kaç sigara içiyorsun?</label><input name="cigsPerDay" type="number" min="0" max="200" required value="${S.cigsPerDay}"></div><div><label class="field">Paket fiyatı (₺)</label><input name="packPrice" type="number" min="0" step="0.01" value="${S.packPrice}"></div></div><div class="fieldgrid"><div><label class="field">Pakette kaç adet var?</label><input name="packSize" type="number" min="1" max="100" value="${S.packSize}"></div><div><label class="field">Vape / elektronik sigara?</label><select name="usesVape"><option value="false" ${!S.usesVape?'selected':''}>Hayır</option><option value="true" ${S.usesVape?'selected':''}>Evet</option></select></div></div><p class="muted">Bu uygulama takip ve motivasyon içindir; tıbbi tedavinin yerine geçmez.</p><button class="btn" type="submit">Planımı oluştur</button></form></section>`}
function todayView(){const now=new Date(),k=dayKey(now),tasks=tasksFor(now);let html=card(`Bugünün hedefleri · ${dateTR(now)}`,tasks.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${k}#${i}" ${S.checks[k+'#'+i]?'checked':''}><span>${t}</span></label>`).join('')+`<div class="bar"><i style="width:${Math.round(tasks.filter((_,i)=>S.checks[k+'#'+i]).length/tasks.length*100)}%"></i></div><p class="muted">${tasks.filter((_,i)=>S.checks[k+'#'+i]).length}/${tasks.length} hedef tamamlandı</p>`);
 html+=`<section class="card"><h2>Kullandım, kaydet</h2><p class="muted">Kendini yargılamak için değil, alışkanlığını tanımak için kayıt tut.</p><div class="chips" id="typeChips"><button class="chip" data-type="sigara" aria-pressed="true">Sigara</button><button class="chip" data-type="terea" aria-pressed="false">Terea / ısıtılmış tütün</button><button class="chip" data-type="vape" aria-pressed="false">Vape</button></div><label class="field">Tetikleyici</label><select id="trigger"><option>Kahve</option><option>Stres</option><option>Sıkıntı</option><option>Yemek sonrası</option><option>Telefon / alışkanlık</option><option>Sosyal ortam</option><option>Alkol</option><option>Diğer</option></select><label class="field">Saat</label><input id="logTime" type="time" value="${new Date().toTimeString().slice(0,5)}"><p><button class="btn" id="saveLog">Kaydı ekle</button></p><p class="muted" id="todayCount"></p></section>`;
 html+=card('Bugün kendine not bırak',`<textarea id="todayNote" placeholder="Bugün nasıl gidiyor? Seni ne zorladı?">${esc(S.dailyNotes[k]||'')}</textarea><button class="btn secondary" id="saveNote">Notu kaydet</button>`);return html}
function triggersView(){if(!S.logs.length)return card('Tetikleyici haritan','<p class="muted">Henüz kayıt yok. Bugün sekmesinden kullanım kaydı ekledikçe burada örüntülerini görebilirsin.</p>');const by={},hours={};S.logs.forEach(l=>{by[l.trigger]=(by[l.trigger]||0)+1;const h=new Date(l.time).getHours(),slot=Math.floor(h/3)*3;hours[slot]=(hours[slot]||0)+1});const max=Math.max(...Object.values(by));let html=card('Seni en çok ne tetikliyor?',Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="bars"><span class="name">${esc(n)}</span><span class="track"><i style="width:${v/max*100}%"></i></span><b>${v}</b></div>`).join(''));
 const hm=Math.max(...Object.values(hours));html+=card('Günün hangi saatleri zorlayıcı?',Object.entries(hours).sort((a,b)=>a[0]-b[0]).map(([n,v])=>`<div class="bars"><span class="name">${String(n).padStart(2,'0')}:00–${String(+n+3).padStart(2,'0')}:00</span><span class="track"><i style="width:${v/hm*100}%"></i></span><b>${v}</b></div>`).join(''));
 html+=card('Son kayıtlar',S.logs.slice(-12).reverse().map(l=>`<div class="logitem"><span class="muted">${new Date(l.time).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${esc(l.type)} · ${esc(l.trigger)}</span><button class="btn secondary small" data-delete="${l.id}">Sil</button></div>`).join(''));return html}
function progressView(){const q=parseDate(S.quitDate),now=Date.now(),elapsed=Math.max(0,now-q.getTime()),quitDays=Math.max(0,Math.floor(elapsed/DAY));const after=S.logs.filter(l=>l.type!=='vape'&&new Date(l.time)>=q).length;const avoided=Math.max(0,quitDays*S.cigsPerDay-after);const saved=S.packSize>0?avoided/S.packSize*S.packPrice:0;const sinceLast=S.logs.filter(l=>l.type!=='vape').reduce((a,l)=>Math.max(a,new Date(l.time).getTime()),q.getTime());const timer=Math.max(0,now-sinceLast);const hours=Math.floor(timer/3600000),mins=Math.floor(timer%3600000/60000);
 let html=`<div class="stats"><section class="card"><b>${quitDays}</b><span class="muted">bırakma gününden beri</span></section><section class="card"><b>${fmt(avoided)}</b><span class="muted">tahmini içilmeyen sigara</span></section><section class="card"><b>${fmt(saved)} ₺</b><span class="muted">tahmini biriken para</span></section><section class="card"><b>${S.urges}</b><span class="muted">atlatılan dürtü</span></section></div>`;
 html+=card('Son kayıttan beri',`<div class="big" style="font-size:1.8rem;font-weight:800">${Math.floor(timer/DAY)} gün ${hours%24} sa ${mins} dk</div><p class="muted">Kayıt eklemediysen bu sayaç bırakma tarihinden itibaren hesaplanır. Kayıtlar dürüstçe tutulduğunda daha anlamlıdır.</p>`);
 const milestones=[[1,'İlk 24 saat'],[2,'48 saat'],[3,'72 saat'],[7,'İlk hafta'],[14,'2 hafta'],[30,'30 gün'],[90,'90 gün'],[365,'1 yıl']];html+=card('Kilometre taşların',milestones.map(([d,t])=>`<p>${quitDays>=d?'✅':'⏳'} ${d} gün · ${t}</p>`).join(''));
 html+=card('Neden bırakıyorum?',`<textarea id="reasons" placeholder="Zorlandığında hatırlamak istediğin 3 nedeni yaz.">${esc(S.reasons)}</textarea><button class="btn secondary" id="saveReasons">Kaydet</button>`);
 html+=card('30 günlük takip',`<div class="grid30">${Array.from({length:30},(_,i)=>{const d=new Date(q.getTime()+i*DAY);return `<div class="cell ${d<=new Date()&&complete(d)?'done':''} ${dayKey(d)===dayKey(new Date())?'now':''}" title="${dateTR(d)}"></div>`}).join('')}</div><p class="muted">Dolu kutu, o günün görevlerinin tamamlandığını gösterir.</p>`);return html}
function planView(){const start=parseDate(S.quitDate),today=new Date();today.setHours(0,0,0,0);const from=new Date(Math.min(start.getTime(),today.getTime()));const end=new Date(Math.max(start.getTime(),today.getTime())+30*DAY);let html='';let total=0,doneN=0;for(let d=new Date(from);d<=end;d.setDate(d.getDate()+1)){const x=new Date(d),k=dayKey(x),ts=tasksFor(x),n=ts.filter((_,i)=>S.checks[k+'#'+i]).length;total+=ts.length;doneN+=n;html+=`<section class="day ${k===dayKey(today)?'today':''} ${n===ts.length?'complete':''}"><div class="dayhead"><h3>${dateTR(x)} ${k===S.quitDate?'· Bırakma günü':''}</h3><span class="tag">${n}/${ts.length}</span></div>${ts.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${k}#${i}" ${S.checks[k+'#'+i]?'checked':''}><span>${t}</span></label>`).join('')}</section>`}return card('Genel plan',`<b>${doneN}/${total} görev tamamlandı</b><div class="bar"><i style="width:${total?doneN/total*100:0}%"></i></div>`)+html}
function settingsView(){return `<section class="card"><h2>Kişisel ayarların</h2><form id="settingsForm"><label class="field">Adın</label><input name="name" maxlength="30" value="${esc(S.name)}"><label class="field">Bırakma tarihi</label><input name="quitDate" type="date" required value="${esc(S.quitDate)}"><div class="fieldgrid"><div><label class="field">Günlük sigara</label><input name="cigsPerDay" type="number" min="0" max="200" value="${S.cigsPerDay}"></div><div><label class="field">Paket fiyatı (₺)</label><input name="packPrice" type="number" min="0" step="0.01" value="${S.packPrice}"></div></div><div class="fieldgrid"><div><label class="field">Paket adedi</label><input name="packSize" type="number" min="1" max="100" value="${S.packSize}"></div><div><label class="field">Vape kullanıyor musun?</label><select name="usesVape"><option value="false" ${!S.usesVape?'selected':''}>Hayır</option><option value="true" ${S.usesVape?'selected':''}>Evet</option></select></div></div><p><button class="btn">Ayarları kaydet</button></p></form></section>
 <section class="card"><h2>Verilerini yedekle</h2><p class="muted">Veriler yalnızca bu cihazdaki tarayıcıda tutulur. Telefon değiştirirsen yedek alıp yeni cihazda geri yükleyebilirsin.</p><div class="row"><button class="btn secondary" id="exportData">Yedeği indir</button><label class="btn secondary" for="importFile">Yedeği geri yükle</label><input class="hidden" id="importFile" type="file" accept="application/json"></div></section>
 <section class="card"><h2>Veri ve gizlilik</h2><p class="muted">Bu sürümde hesap açma veya merkezi sunucu yoktur. Aynı bağlantıyı kullanan kişiler birbirlerinin kayıtlarını göremez. Ancak kayıtların farklı cihazlara otomatik senkronize edilmez.</p><button class="btn danger" id="resetData">Tüm verilerimi sıfırla</button></section>`}
function draw(){if(!S.setup){$('view').innerHTML=setupView();bindSetup();return}const views=[todayView,triggersView,progressView,planView,settingsView];$('view').innerHTML=views[current]();bindCommon();if(current===0)bindToday();if(current===2)bindProgress();if(current===4)bindSettings();hero()}
function hero(){if(!S.setup)return;const diff=daysSinceQuit();if(diff<0){$('counter').textContent=`${Math.abs(diff)} gün kaldı`;$('subcounter').textContent=`${S.name?S.name+', ':''}${new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long'}).format(parseDate(S.quitDate))} için hazırlanıyorsun.`}else{$('counter').textContent=`${diff} gün ${Math.floor((Date.now()-parseDate(S.quitDate))/3600000%24)} saat`;$('subcounter').textContent='Bırakma yolculuğunda her gün önemli. Bir tökezleme olursa da kaldığın yerden devam edebilirsin.'}}
function bindSetup(){const f=$('setupForm');f.onsubmit=e=>{e.preventDefault();applyForm(new FormData(f));S.setup=true;save();current=0;drawTabs();draw()}}
function applyForm(fd){S.name=fd.get('name')||'';S.quitDate=fd.get('quitDate');S.cigsPerDay=Math.max(0,Number(fd.get('cigsPerDay'))||0);S.packPrice=Math.max(0,Number(fd.get('packPrice'))||0);S.packSize=Math.max(1,Number(fd.get('packSize'))||20);S.usesVape=fd.get('usesVape')==='true';}
function bindSettings(){const f=$('settingsForm');f.onsubmit=e=>{e.preventDefault();applyForm(new FormData(f));save();draw()};$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='birakma-rehberi-yedek.json';a.click();URL.revokeObjectURL(a.href)};$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object'||!data.quitDate)throw Error();S={...defaults,...data};save();current=0;drawTabs();draw();alert('Yedek başarıyla yüklendi.')}catch(err){alert('Bu dosya geçerli bir Bırakma Rehberi yedeği değil.')}};$('resetData').onclick=()=>{if(confirm('Bütün kayıtların silinsin mi? Bu işlem geri alınamaz. Önce yedek almanı öneririz.')){localStorage.removeItem(KEY);S={...defaults};current=0;drawTabs();draw()}}}
function bindCommon(){$('view').querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{if(c.checked)S.checks[c.dataset.check]=1;else delete S.checks[c.dataset.check];save();draw()});$('view').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{S.logs=S.logs.filter(x=>String(x.id)!==b.dataset.delete);save();draw()})}
let selectedType='sigara';function bindToday(){document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))) });const count=S.logs.filter(l=>dayKey(new Date(l.time))===dayKey(new Date())&&l.type!=='vape').length;$('todayCount').textContent=`Bugün kaydettiğin sigara / Terea: ${count}`;$('saveLog').onclick=()=>{const t=$('logTime').value;if(!t)return alert('Lütfen saat seç.');const [h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d>Date.now())d.setDate(d.getDate()-1);S.logs.push({id:Date.now()+Math.random(),time:d.toISOString(),type:selectedType,trigger:$('trigger').value});save();draw()};$('saveNote').onclick=()=>{S.dailyNotes[dayKey(new Date())]=$('todayNote').value;save();alert('Notun kaydedildi.') }}
function bindProgress(){$('saveReasons').onclick=()=>{S.reasons=$('reasons').value;save();alert('Kaydedildi.')}}
const tips=['Bir bardak su iç ve yavaşça içmeye odaklan.','Ayağa kalkıp birkaç dakika yürü.','Ellerini meşgul edecek bir şey bul.','Bulunduğun ortamı kısa süreliğine değiştir.','Dürtünün geçmesini bekle; kendine yüklenme.'];let interval=null,left=300;
function openUrge(){clearInterval(interval);left=300;$('overlay').classList.add('on');$('oDone').classList.add('hidden');$('oTitle').textContent='Dürtü dalga gibi gelir ve geçer.';const tick=()=>{$('oTime').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;$('oBreath').textContent=(300-left)%10<4?'Yavaşça nefes al':'Yavaşça nefes ver';$('oTip').textContent=tips[Math.floor((300-left)/35)%tips.length];if(left<=0){clearInterval(interval);$('oTitle').textContent='Bu anı atlattın. Kendinle gurur duy.';$('oDone').classList.remove('hidden')}else left--};tick();interval=setInterval(tick,1000)}
$('urgeBtn').onclick=openUrge;$('oClose').onclick=()=>{clearInterval(interval);$('overlay').classList.remove('on')};$('oDone').onclick=()=>{S.urges++;save();$('oClose').click();draw()};$('settingsTop').onclick=()=>{if(!S.setup){draw();return}setTab(4)};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(!S.setup){draw()}else{drawTabs();draw()}setInterval(hero,60000);
})();
</script></body></html>
